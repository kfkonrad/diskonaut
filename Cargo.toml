[package]
name = "diskonaut-x"
description = "Terminal disk space visual navigator"
version = "1.0.1"
authors = ["Aram Drevekenin <aram@poor.dev>", "Kevin Konrad <info@kevinkonrad.de>"]
readme = "README.md"
homepage = "https://github.com/kfkonrad/diskonaut"
repository = "https://github.com/kfkonrad/diskonaut"
license = "MIT"
edition = "2024"
keywords = ["tui", "disk", "filesystem", "terminal", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = [".github", "dist"]

[[bin]]
name = "diskonaut"
path = "src/main.rs"

[dependencies]
ratatui = {version="0.30", default-features = false, features = ['crossterm'] }
crossterm = "0.29"
anyhow = "1"
jwalk = "0.8"
clap = { version = "4", features = ["derive"] }
filesize = "0.2.0"
unicode-width = "0.2.2"
nix = { version = "0.31.3", features = ["user"] }
float-cmp = "0.10.0"
[target.'cfg(windows)'.dependencies]
is_elevated = "0.1.2"

[dev-dependencies]
insta = "1.47.2"

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimisation
codegen-units = 1 # Reduced to increase optimisations.
panic = 'abort'   # Abort on panic
strip = "symbols" # Strip symbols from binary

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
