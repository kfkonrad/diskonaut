name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Extract changelog for current version
        run: |
          VERSION="${REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${REF_NAME} implies version ${VERSION}, but Cargo.toml says ${CARGO_VERSION}" >&2
            exit 1
          fi
          # this oneliner does the following:
          # - select the section of the changelog for the current version,
          #   ending at the next version header or at the link-reference block
          #   (the latter matters for the oldest section in the file, which has
          #   no version header after it)
          # - remove the last line (which is that terminator)
          # - replace "##" with "#" to adjust markdown levels
          # - remove extra blank lines
          # BSD sed on macos-latest has no BRE alternation, hence -E
          sed -n -E "/^## \[${VERSION}\]/,/^(## \[|\[Unreleased\]:)/p" CHANGELOG.md | sed '$d' | sed 's/^##/#/' | cat -s > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section" >&2
            exit 1
          fi
        env:
          REF_NAME: ${{ github.ref_name }}
      - uses: goreleaser/goreleaser-action@v7.0.0
        with:
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
